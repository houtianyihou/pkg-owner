[package]
name = "pkg-owner"
version = "0.2.0"
edition = "2021"
description = "Read-only macOS application and command package ownership lookup"
license = "MIT"
repository = "https://github.com/houtianyihou/pkg-owner"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-casefold = "0.2"
libc = "0.2"
